name: Benchmark task (Python, Docker)
description: Same task as the TS action, as a Docker container action. The image is built from the Dockerfile on every run (Linux runners only).
inputs:
  data_file:
    description: Path to the JSON records file
    required: true
  token:
    description: GitHub token for the API call
    required: false
    default: ${{ github.token }}
outputs:
  summary:
    description: JSON summary
  work_ms:
    description: Milliseconds spent inside the action's own code
runs:
  using: docker
  image: Dockerfile
